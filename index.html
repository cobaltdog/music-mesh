<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesh</title>
<meta name="description" content="Prepare, connect and perform: rate songs, record transitions and play DJ sets from your own music folder.">
<meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
  /* Apply the theme before first paint, so there is no flash. */
  (function () { try { var t = JSON.parse(localStorage.getItem('mesh2.theme') || '"system"'); if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; document.documentElement.dataset.theme = t; } catch (e) {} })();
</script>
<link rel="stylesheet" href="css/mesh.css">
</head>
<body>
<!--
  Mesh 2.0 "Second Release"
  One app for the whole DJ workflow: Rate (prepare) · Add music (connect) · DJ (perform).
  Ratings live in the FLAC tags, transitions in the .mesh file, key rules in KeyRules v1.
  Design plan: docs/design-plan-v2.md
-->
<div class="ambient" id="ambient" aria-hidden="true"><div class="layer"></div><div class="layer"></div></div>

<!-- OPEN -->
<section class="open" id="v-open" aria-label="Open a music folder">
  <div class="open-inner">
    <svg class="open-art" viewBox="0 0 220 160" aria-hidden="true">
      <path class="edge on" d="M40 92 C 70 40, 100 40, 112 52"/>
      <path class="edge on" d="M112 52 C 140 70, 160 100, 182 96"/>
      <path class="edge" d="M112 52 C 120 90, 100 120, 82 128"/>
      <path class="edge" d="M40 92 C 52 120, 64 126, 82 128"/>
      <path class="edge" d="M182 96 C 186 60, 178 40, 168 30"/>
      <circle cx="40" cy="92" r="9" fill="var(--harmonic)"/>
      <circle cx="112" cy="52" r="12" fill="var(--tint)"/>
      <circle cx="182" cy="96" r="9" fill="var(--energy)"/>
      <circle cx="82" cy="128" r="7" fill="var(--label-3)"/>
      <circle cx="168" cy="30" r="6" fill="var(--creative)"/>
    </svg>
    <h1>Mesh</h1>
    <p class="lede">Rate your songs, record the mixes you know, and play sets with the Key Wheel beside you.</p>
    <div class="open-actions">
      <button class="btn primary lg" id="btn-pick">Choose music folder</button>
      <button class="btn lg" id="btn-reopen" hidden>Reopen <b></b></button>
    </div>
    <div class="open-panel card" id="open-panel" hidden></div>
    <p class="foot" id="open-foot">Your music, ratings and .mesh file stay on this computer.</p>
    <p class="banner warn" id="open-unsupported" hidden><span class="ic"></span>This browser can't open folders. Use Chrome, Edge or Arc on a computer.</p>
  </div>
</section>

<!-- APP -->
<div class="app" id="app" hidden>
  <nav class="sidebar" aria-label="Mesh">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--primary)"/><path d="M8 17.5 14 9l6 8.5" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="17.5" r="2.4" fill="var(--harmonic)"/><circle cx="14" cy="9" r="2.4" fill="var(--tint)"/><circle cx="20" cy="17.5" r="2.4" fill="var(--energy)"/></svg>
      <span class="brand-name">Mesh</span><span class="brand-ver">2.0</span>
    </div>
    <button class="field side-search" id="side-search" aria-label="Search (slash)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span>Search</span><kbd class="kbd">/</kbd></button>
    <div class="nav" id="nav" role="list"></div>
    <div class="side-foot">
      <div class="side-file">
        <button class="icon-btn sm filled" id="btn-settings" aria-label="Settings" aria-haspopup="dialog"></button>
        <span class="txt"><span class="t" id="side-file"></span><span class="save-status" id="save-status">opened</span></span>
      </div>
    </div>
  </nav>

  <main class="main" id="main">
    <section class="view" id="v-home" aria-label="Home" hidden></section>
    <section class="view" id="v-rate" aria-label="Rate songs" hidden></section>
    <section class="view" id="v-add" aria-label="Add music" hidden></section>
    <section class="view" id="v-dj" aria-label="DJ mode" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Mesh"></nav>
</div>

<!-- Mini player: the one shared player, shown outside Rate and DJ -->
<div class="mini" id="mini" aria-label="Now playing">
  <button class="open-dj" id="mini-open" aria-label="Open in DJ mode"><span id="mini-art"></span><span class="meta"><span class="t" id="mini-t"></span><span class="a" id="mini-a"></span></span></button>
  <button class="icon-btn" id="mini-play" aria-label="Play"></button>
  <span class="bar"><i id="mini-bar"></i></span>
</div>

<!-- Search sheet -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-top">
    <span class="sheet-ctx" id="sheet-title">Search</span>
    <label class="field sheet-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="sheet-q" type="search" placeholder="Title, artist, comment, file…" autocomplete="off" spellcheck="false" role="combobox" aria-controls="sheet-list" aria-expanded="true"></label>
    <div class="sheet-filters" id="sheet-filters"></div>
  </div>
  <ul class="sheet-list" id="sheet-list" role="listbox" aria-label="Results"></ul>
  <div class="sheet-foot"><span id="sheet-n" class="grow"></span><span><kbd class="kbd">↑↓</kbd> move</span><span><kbd class="kbd">↵</kbd> choose</span><span><kbd class="kbd">esc</kbd> close</span></div>
</div>

<div class="popover" id="popover" role="dialog" hidden></div>
<div class="dialog" id="dialog" role="alertdialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="ic"></span><span id="toast-msg"></span></div>

<audio id="player" preload="auto"></audio>

<script src="js/util.js"></script>
<script src="js/keyrules.js"></script>
<script src="js/flactags.js"></script>
<script src="js/scheme.js"></script>
<script src="js/accent.js"></script>
<script src="js/library.js"></script>
<script src="js/meshstore.js"></script>
<script src="js/suggest.js"></script>
<script src="js/app.js"></script>
<script src="js/views.js"></script>
</body>
</html>
